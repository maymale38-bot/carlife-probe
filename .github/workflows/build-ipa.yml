name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          set -e
          xcodebuild \
            -project CarLifeProbe.xcodeproj \
            -scheme CarLifeProbe \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/CarLifeProbe.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r CarLifeProbe-unsigned.ipa Payload
          ls -lh CarLifeProbe-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarLifeProbe-unsigned-ipa
          path: CarLifeProbe-unsigned.ipa
          retention-days: 30