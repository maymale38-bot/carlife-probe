name: CarLifeProbe

options:
  bundleIdPrefix: com.probe
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  CarLifeProbe:
    type: application
    platform: iOS
    sources:
      - path: CarLifeProbe
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: CarLifeProbe/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.probe.carlifeprobe
        PRODUCT_NAME: CarLifeProbe
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: []
